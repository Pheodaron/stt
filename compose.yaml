name: vks-stt

services:
  stt:
    image: localhost/vks-stt-go:cpu
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: vks-stt
    env_file:
      - .env
    environment:
      URL: 0.0.0.0
      PORT: "8080"
      MODEL_PROVIDER: cpu
    ports:
      - "${HOST_PORT:-8080}:8080"
    init: true
    stop_grace_period: 15s
