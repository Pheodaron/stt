[tasks."build:cpu"]
description = "Build the CPU container with Podman"
run = "podman build --file Dockerfile.cpu --tag localhost/vks-stt-go:cpu ."

[tasks."build:gpu"]
description = "Build the CUDA container with Podman"
run = "podman build --file Dockerfile.gpu --tag localhost/vks-stt-go:cuda ."

[tasks.proto]
description = "Regenerate Go protobuf sources"
tools.go = "1.25.1"
run = '''
protoc -I proto \
  --plugin=protoc-gen-go="$(go tool -n protoc-gen-go)" \
  --plugin=protoc-gen-go-grpc="$(go tool -n protoc-gen-go-grpc)" \
  --go_out=. --go_opt=module=vks-stt-v2 \
  --go-grpc_out=. --go-grpc_opt=module=vks-stt-v2 \
  proto/stt/v1/stt.proto
'''
